name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work? Sketches or screenshots of other apps are welcome.
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to build this myself
